<!doctype html>
<html class="h-full" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta
      name="theme-color"
      content="white"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="black"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="End-to-end encrypted text and file sharing platform"
    />
    <title>Paaster – Secure Text and File Sharing</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          var dark =
            theme === "dark" ||
            (theme !== "light" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        var r = document.documentElement;
        function f() {
          r.style.setProperty(
            "--stage-scale",
            String(Math.min(1, (r.clientWidth - 32) / 560)),
          );
        }
        f();
        addEventListener("resize", f);
      })();
    </script>
  </head>
  <body class="flex h-full scroll-smooth flex-col antialiased">
    <div id="root" class="flex h-full flex-1 flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
